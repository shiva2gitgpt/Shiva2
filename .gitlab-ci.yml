image: node:22-alpine

verify:
  stage: test
  script:
    - node --check server.js
    - node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); JSON.parse(require('fs').readFileSync('foundation-manifest.json','utf8')); console.log('JSON contracts OK')"
    - node -e "const fs=require('fs'); for(const f of ['index.html','account-center.html','agent.html']){const s=fs.readFileSync(f,'utf8'); if(!s.includes('<!DOCTYPE html>')||!s.includes('</html>')) process.exit(1); console.log(f+' structure OK')}"
    - node -e "const fs=require('fs'); const s=fs.readFileSync('server.js','utf8'); if(!s.includes('gemini-3.6-flash')||!s.includes('openai/gpt-oss-120b')||!s.includes('message:ai.reply')||!s.includes('model:ai.model')) process.exit(1); console.log('AI compatibility checks OK')"
    - node -e "const fs=require('fs'); const s=fs.readFileSync('agent.html','utf8'); if(!s.includes('/api/message')||!s.includes('/api/projects')||!s.includes('/api/tasks')||!s.includes('/api/memory')) process.exit(1); console.log('Agent workspace integration checks OK')"
