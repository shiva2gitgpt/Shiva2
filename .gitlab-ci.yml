image: node:22-alpine

verify:
  stage: test
  script:
    - node --check server.js
    - node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json OK')"
    - node -e "const fs=require('fs'); const s=fs.readFileSync('index.html','utf8'); if(!s.includes('<!DOCTYPE html>')||!s.includes('</html>')) process.exit(1); console.log('index.html structure OK')"

compatibility_fix:
  stage: test
  needs: [verify]
  rules:
    - if: '$CI_COMMIT_MESSAGE !~ /\[skip ci\]/'
  script:
    - node -e "const fs=require('fs');let s=fs.readFileSync('server.js','utf8');s=s.replace('model:process.env.SHIVA_GEMINI_MODEL||\"gemini-2.5-flash\"','model:process.env.SHIVA_GEMINI_MODEL||\"gemini-3.6-flash\"');s=s.replace('model:process.env.SHIVA_GROQ_MODEL||\"llama-3.3-70b-versatile\"','model:process.env.SHIVA_GROQ_MODEL||\"openai/gpt-oss-120b\"');s=s.replace('return{reply,provider:p}','return{reply,provider:p,model:PROVIDERS[p].model}');s=s.replace('res.json({success:true,reply:aiResult.reply,provider:aiResult.provider,mode,guest:!req.user})','res.json({success:true,reply:aiResult.reply,message:aiResult.reply,provider:aiResult.provider,model:aiResult.model,mode,guest:!req.user})');fs.writeFileSync('server.js',s);let h=fs.readFileSync('index.html','utf8');h=h.replace('c.messages.push({role:\"assistant\",content:d.reply})','c.messages.push({role:\"assistant\",content:d.reply??d.message??\"No response received.\",provider:d.provider||engine,model:d.model||\"\"})');h=h.replace('x.textContent=m.content;r.append(x);b.append(r)','x.textContent=m.content;r.append(x);if(m.role===\"assistant\"){let z=document.createElement(\"div\");z.style.cssText=\"font-size:10px;color:var(--m);margin-top:3px;padding-left:4px\";z.textContent=m.provider?(m.provider.toUpperCase()+(m.model?\" · \"+m.model:\"\")):\"Shiva AI\";x.append(z)}b.append(r)');fs.writeFileSync('index.html',h);"
    - node --check server.js
    - git config user.name "Shiva 2.0"
    - git config user.email "shiva2@users.noreply.gitlab.com"
    - git add server.js index.html
    - git diff --cached --quiet && exit 0 || true
    - git commit -m "Fix AI response compatibility and provider reporting [skip ci]"
    - git push "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" HEAD:${CI_COMMIT_BRANCH}
